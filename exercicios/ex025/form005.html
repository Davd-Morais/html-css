<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
    fieldset {
        border: 2px solid black;
        padding: 20px;
        margin: 20px 0;
    }

    legend {
        font-size: 2em;
        font-weight: bold;
        padding: 0 10px;
    }
    
    input[type="checkbox"] {
        margin-right: 10px;
    }

    input {
        margin: 5px;
        padding: 10px;
        font-size: 1em;
    }

    body {
        font-family: Arial, sans-serif;
    }
</style>

</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" id="isxmas" value="M"> <label for="isxmas">Masculino</label><br>
            <input type="radio" name="sexo" id="esxfem" value="F" checked> <label for="esxfem">Feminino</label>

        </fieldset>

        <fieldset>
            <legend>Esportes</legend>
            <input type="checkbox" name="esbas" id="iesbas"> <label for="iesbas">Basquete</label> <br>
            <input type="checkbox" name="esfut" id="iesfut" checked> <label for="iesfut">Futebol</label> <br>
            <input type="checkbox" name="esnat" id="iesnat"> <label for="iesnat">Natação</label> <br>
            <input type="checkbox" name="esten" id="iesten"> <label for="iesten">Tênis</label> <br>
            <input type="checkbox" name="esvoo" id="iesvoo"> <label for="iesvoo">Vôlei</label> <br>
        </fieldset>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
